name: Private source build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  macos:
    runs-on: xcode-27
    timeout-minutes: 120
    environment: Build
    steps:
      - name: Check required settings
        env:
          IITCMAPKIT_READ_TOKEN: ${{ secrets.IITCMAPKIT_READ_TOKEN }}
          ARTIFACT_PASSWORD: ${{ secrets.ARTIFACT_PASSWORD }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY || vars.SIGNING_IDENTITY }}
          SIGNING_TEAM_ID: ${{ secrets.SIGNING_TEAM_ID || vars.SIGNING_TEAM_ID }}
        run: |
          python3 - <<'PYTHON'
          import os, sys
          names = ('IITCMAPKIT_READ_TOKEN', 'ARTIFACT_PASSWORD',
                   'MACOS_CERTIFICATE_P12_BASE64', 'MACOS_CERTIFICATE_PASSWORD',
                   'NOTARY_APPLE_ID', 'NOTARY_APP_PASSWORD', 'SIGNING_IDENTITY', 'SIGNING_TEAM_ID')
          missing = [name for name in names if not os.environ.get(name)]
          for name in missing:
              print('::error::Missing ' + name)
          sys.exit(bool(missing))
          PYTHON
      - uses: actions/checkout@v7
        id: checkout
        with:
          persist-credentials: false
      - name: Check release safeguards
        run: python3 -m unittest discover -s tests -v
      - name: Checkout pinned private source
        env:
          GH_TOKEN: ${{ secrets.IITCMAPKIT_READ_TOKEN }}
        run: python3 scripts/checkout.py
      - name: Validate release tag against pinned source
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py --tag "$RELEASE_TAG" --source-version iitc_mapkit/VERSION
      - name: Build tools
        run: |
          test "$(uname -m)" = arm64
          brew install sevenzip ripgrep python
      - name: Build, sign, notarize and verify
        id: build
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY || vars.SIGNING_IDENTITY }}
          SIGNING_TEAM_ID: ${{ secrets.SIGNING_TEAM_ID || vars.SIGNING_TEAM_ID }}
        run: python3 scripts/build.py
      - name: Encrypt diagnostic logs
        id: encrypt
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          ARTIFACT_PASSWORD: ${{ secrets.ARTIFACT_PASSWORD }}
        run: python3 scripts/encrypt-artifacts.py --platform macos-arm64
      - name: Upload encrypted diagnostic logs
        if: ${{ !cancelled() && steps.encrypt.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: IITCMapKit-macos-arm64-logs-encrypted
          path: dist-encrypted/IITCMapKit-macos-arm64-logs.7z
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload public zip
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.package_base }}.zip
          path: dist-artifacts/${{ steps.build.outputs.package_base }}.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload public zip.sha256
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.package_base }}.zip.sha256
          path: dist-artifacts/${{ steps.build.outputs.package_base }}.zip.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload public dmg
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.package_base }}.dmg
          path: dist-artifacts/${{ steps.build.outputs.package_base }}.dmg
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload public dmg.sha256
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.package_base }}.dmg.sha256
          path: dist-artifacts/${{ steps.build.outputs.package_base }}.dmg.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  release:
    name: Publish GitHub Release
    needs: macos
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download public packages only
        uses: actions/download-artifact@v8
        with:
          pattern: IITC-MapKit-*-macOS-arm64.*
          path: release-assets
          merge-multiple: true
      - name: Verify assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py --tag "$RELEASE_TAG" --assets release-assets
